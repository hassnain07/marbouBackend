version: "3.9"

# ─── MARBOU local development stack ──────────────────────────────────────────
# Services:  api · postgres (PostGIS + pg_trgm) · redis · minio · mailhog
#
# Full stack:
#   docker compose -f docker/docker-compose.yml up -d
#
# Infrastructure only (no api build — use `npm run dev` on the host):
#   docker compose -f docker/docker-compose.yml up -d postgres redis minio minio-init mailhog
#
# Ports:
#   api      3000  (REST + WebSocket)
#   postgres 5433  (host) → 5432 (container)  [5433 to avoid clashing with local PG]
#   redis    6379
#   minio    9000 (S3 API)  9001 (web console)
#   mailhog  1025 (SMTP)    8025 (web UI)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL with PostGIS (includes pg_trgm) ────────────────────────────
  # Host port 5433 (not 5432) to avoid clashing with a developer's local
  # PostgreSQL that commonly binds 5432. The API container connects to this
  # service on the internal port 5432 via the `postgres` hostname (see the
  # api service DATABASE_URL), so the host-side remap only affects host tooling
  # (prisma migrate, npm run dev).
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: marbou_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: marbou
      POSTGRES_PASSWORD: marbou
      POSTGRES_DB: marbou_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marbou -d marbou_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: marbou_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────
  # The official `minio/minio` image was removed from Docker Hub in September 2026;
  # we use the Chainguard-maintained MinIO image instead (same MinIO server binary,
  # RELEASE.2026-11-12). It bundles `mc` but no wget/curl, so the healthcheck uses
  # `mc ready` against a temporary local alias. The health endpoint it effectively
  # checks is http://localhost:9000/minio/health/live.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: marbou_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: marbou
      MINIO_ROOT_PASSWORD: marbou-secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      # `mc ready` exits 0 when the server is ready. $$ escapes to $ in the
      # container shell so the root credentials are read from the env above.
      test: ["CMD-SHELL", "mc alias set hc http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1; mc ready hc || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── MinIO bucket initialisation (runs once, creates buckets) ─────────────
  # Uses the `kukuruser/mc` image — the last public `mc` build after MinIO
  # removed `minio/mc` from Docker Hub in September 2026. It retries in a loop
  # so it tolerates MinIO startup latency beyond the healthcheck start period.
  minio-init:
    image: kukuruser/mc:latest
    container_name: marbou_minio_init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 marbou marbou-secret; do
          echo 'Waiting for MinIO...'; sleep 2;
        done &&
        mc mb --ignore-existing local/marbou-public &&
        mc mb --ignore-existing local/marbou-private &&
        mc anonymous set download local/marbou-public &&
        echo 'MinIO buckets ready'
      "

  # ── Mailhog (SMTP dev server + web UI) ───────────────────────────────────
  # `mailhog/mailhog` is a scratch image (single binary, no shell tools), so it
  # cannot run a shell-based healthcheck. The API does not depend on MailHog
  # being healthy — it is SMTP-only for local email capture, and the readiness
  # probe checks DB/Redis/storage, not SMTP — so no healthcheck is defined here.
  # MailHog's web UI (http://localhost:8025) and SMTP (localhost:1025) come up
  # almost instantly with the container.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: marbou_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # ── API ───────────────────────────────────────────────────────────────────
  # NODE_ENV is set to 'development' (not 'production') so:
  #   - DevOnlyGuard allows /dev/* routes for Postman testing
  #   - INTEGRATIONS_MODE=mock loads mock adapters (email → mailhog, storage → minio)
  #   - Zod env schema does not reject INTEGRATIONS_MODE=mock (only blocked in prod)
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: marbou_api
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Service-network URLs — override whatever is in .env
      DATABASE_URL: postgresql://marbou:marbou@postgres:5432/marbou_db?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BUCKET: marbou-public
      S3_PRIVATE_BUCKET: marbou-private
      S3_ACCESS_KEY: marbou
      S3_SECRET_KEY: marbou-secret
      S3_FORCE_PATH_STYLE: "true"
      CDN_BASE_URL: http://localhost:9000
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: "MARBOU <no-reply@marbou.test>"
      # 'development' keeps /dev/* routes alive and mock adapters allowed.
      # Change to 'staging' for a staging-like environment with real secrets.
      NODE_ENV: development
      INTEGRATIONS_MODE: mock
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health 2>&1 && exit 0 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
  minio_data:
