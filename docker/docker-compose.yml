version: "3.9"

# ─── MARBOU local development stack ──────────────────────────────────────────
# Services:  api · postgres (PostGIS + pg_trgm) · redis · minio · mailhog
# Usage:
#   cp .env.example .env          # fill in secrets
#   docker compose up -d          # start everything
#   docker compose logs -f api    # watch the API
#
# Ports:
#   api      3000  (REST + WebSocket)
#   postgres 5432
#   redis    6379
#   minio    9000 (S3 API)  9001 (web console)
#   mailhog  1025 (SMTP)    8025 (web UI)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL with PostGIS (includes pg_trgm) ────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: marbou_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: marbou
      POSTGRES_PASSWORD: marbou
      POSTGRES_DB: marbou_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marbou -d marbou_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: marbou_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: marbou_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: marbou
      MINIO_ROOT_PASSWORD: marbou-secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── MinIO bucket initialisation (runs once, creates buckets) ─────────────
  minio-init:
    image: minio/mc:latest
    container_name: marbou_minio_init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 marbou marbou-secret &&
        mc mb --ignore-existing local/marbou-public &&
        mc mb --ignore-existing local/marbou-private &&
        mc anonymous set download local/marbou-public &&
        echo 'MinIO buckets ready'
      "

  # ── Mailhog (SMTP dev server + web UI) ───────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: marbou_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8025/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: marbou_api
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://marbou:marbou@postgres:5432/marbou_db?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BUCKET: marbou-public
      S3_PRIVATE_BUCKET: marbou-private
      S3_ACCESS_KEY: marbou
      S3_SECRET_KEY: marbou-secret
      S3_FORCE_PATH_STYLE: "true"
      CDN_BASE_URL: http://localhost:9000
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: "MARBOU <no-reply@marbou.test>"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  minio_data:
