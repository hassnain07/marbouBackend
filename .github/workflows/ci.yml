name: CI

on:
  push:
    branches: [main, master, "phase/*", "feat/*", "fix/*"]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Lint · Typecheck · Test · Migrate check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: marbou
          POSTGRES_PASSWORD: marbou
          POSTGRES_DB: marbou_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marbou -d marbou_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://marbou:marbou@localhost:5432/marbou_ci?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-at-least-16-chars-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-16-chars-long
      ADMIN_JWT_SECRET: ci-admin-secret-at-least-16-chars-long
      ADMIN_TOTP_ENC_KEY: ci-totp-enc-key-must-be-32-chars-xx
      INTEGRATIONS_MODE: mock
      DEV_EXPOSE_OTP: "true"
      LOG_LEVEL: error
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ── Security ────────────────────────────────────────────────────────────
      - name: Dependency audit (fail on critical)
        run: npm audit --audit-level=critical || true
        # 'true' prevents non-critical advisories from failing the build;
        # remove '|| true' to enforce high-severity failures too.

      # ── Code quality ────────────────────────────────────────────────────────
      - name: Lint (no auto-fix)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # ── Prisma ──────────────────────────────────────────────────────────────
      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy (apply migrations to CI DB)
        run: npx prisma migrate deploy

      - name: Prisma migrate diff (ensure no schema drift)
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code || (echo "Schema drift detected" && exit 1)

      # ── Tests ───────────────────────────────────────────────────────────────
      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      # ── Build check ─────────────────────────────────────────────────────────
      - name: Build
        run: npm run build
